aid: axeleraai

name: Axeleraai

description: Axeleraai (Axelera AI) develops high‑performance AI accelerators and edge computing solutions, offering hardware such as the Metis
  and Europa AI processors, a comprehensive SDK (Voyager), model zoo, and enterprise‑grade software. The company focuses on datacenter performance,
  edge efficiency, and sovereign AI, targeting industries like manufacturing, healthcare, and robotics. Their products span embedded, edge, and
  server form‑factors, emphasizing low power consumption, high TOPS per watt, and on‑device data privacy.

